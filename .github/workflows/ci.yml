name: Java CI with Maven

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build and Test with Maven
      run: mvn -B clean package
      working-directory: simple-token-validator

    - name: Run SpotBugs SAST Scan
      run: mvn -B spotbugs:check
      working-directory: simple-token-validator

    - name: Run OWASP Dependency Scan
      run: mvn -B org.owasp:dependency-check-maven:check -DfailOnError=false
      working-directory: simple-token-validator

    - name: Upload Security Scan Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          simple-token-validator/target/spotbugsXml.xml
          simple-token-validator/target/dependency-check-report.html